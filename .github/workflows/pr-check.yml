name: PR Check

on:
    pull_request:
        types: [opened, edited, synchronize, reopened]

permissions:
    pull-requests: write

jobs:
    title:
        name: Validate PR title (Conventional Commits)
        runs-on: ubuntu-latest
        steps:
            - uses: amannn/action-semantic-pull-request@v5
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  types: |
                      feat
                      fix
                      docs
                      style
                      refactor
                      perf
                      test
                      build
                      ci
                      chore
                      revert
                  requireScope: false
                  subjectPattern: "^[a-z].+"
                  subjectPatternError: |
                      PR title must start with a lowercase letter.
                      Example: "feat(settings): add dark mode toggle"

    size:
        name: PR size check
        runs-on: ubuntu-latest
        steps:
            - uses: CodelyTV/pr-size-labeler@v1
              with:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  xs_label: "size/XS"
                  xs_max_size: 10
                  s_label: "size/S"
                  s_max_size: 100
                  m_label: "size/M"
                  m_max_size: 500
                  l_label: "size/L"
                  l_max_size: 1000
                  xl_label: "size/XL"
                  fail_if_xl: false

    version-bump:
        name: Require pubspec.yaml version bump (feat/fix)
        runs-on: ubuntu-latest
        # auto-tag.yml only tags (and release.yml only builds/publishes) when pubspec.yaml's
        # version differs from the last tag — a feat/fix PR that forgets to bump it merges with
        # green CI and never ships (found 2026-09-17: PR #19 and #20 both did this silently).
        if: startsWith(github.event.pull_request.title, 'feat') || startsWith(github.event.pull_request.title, 'fix')
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Compare version against main
              run: |
                  git fetch origin main --depth=1
                  base_version=$(git show origin/main:pubspec.yaml | grep '^version:' | awk '{print $2}')
                  head_version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
                  if [ "$base_version" = "$head_version" ]; then
                    echo "::error::pubspec.yaml version ($head_version) is unchanged from main — auto-tag.yml silently skips releasing when the tag already exists. Bump the version in this PR (see CHANGELOG.md)."
                    exit 1
                  fi
