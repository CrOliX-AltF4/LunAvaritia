name: Release

# One workflow per tag: test, build the signed release APK, check its signature, publish it.
# It replaces release.yml + build-apk.yml, which ran side by side on the same tag and shipped a debug APK
# signed with a key regenerated on every run — no update could install over the previous one (live check C19).

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        name: Test, build & publish the signed APK
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Check release secrets
              # A release without the real key (or without Firebase) must not ship — refuse instead of falling back.
              env:
                  ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
              run: |
                  missing=""
                  for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS GOOGLE_SERVICES_JSON_B64; do
                    if [ -z "${!name}" ]; then missing="$missing $name"; fi
                  done
                  if [ -n "$missing" ]; then
                    echo "::error::Missing release secrets:$missing"
                    exit 1
                  fi

            - name: Check the tag matches pubspec.yaml
              run: |
                  version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
                  if [ "v$version" != "${{ github.ref_name }}" ]; then
                    echo "::error::Tag ${{ github.ref_name }} does not match pubspec.yaml version $version"
                    exit 1
                  fi

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.38.5"
                  channel: stable
                  cache: true

            - name: Create android/local.properties
              run: |
                  echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
                  echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

            - name: Inject google-services.json
              env:
                  GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
              run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json

            - name: Decode the keystore
              env:
                  ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
              run: |
                  echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
                  echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

            - name: Install dependencies
              run: flutter pub get

            - name: Analyze
              run: flutter analyze

            - name: Test
              run: flutter test

            - name: Build APK (release, signed)
              env:
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
              run: flutter build apk --release

            - name: Check the APK is signed with the release key
              # Compares fingerprints instead of matching apksigner's wording, which changes across build-tools
              # versions ("Signer #1 ..." vs "Signer (minSdkVersion=...) ...") — the 1.4.0 release died on that.
              env:
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
              run: |
                  set -o pipefail
                  sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
                  apksigner=$(ls "$sdk"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
                  if [ -z "$apksigner" ]; then
                    echo "::error::apksigner not found under '$sdk/build-tools'"
                    exit 1
                  fi
                  echo "Using $apksigner"
                  certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
                  echo "$certs"
                  apk_sha=$(echo "$certs" | grep -i "certificate SHA-256 digest" | awk '{print $NF}' | tr 'A-F' 'a-f' | sort -u)
                  key_sha=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
                    | grep -E '^\s*SHA256:' | head -1 | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
                  if [ -z "$apk_sha" ] || [ -z "$key_sha" ]; then
                    echo "::error::Could not read a fingerprint (APK: '${apk_sha}', keystore: '${key_sha}')"
                    exit 1
                  fi
                  if [ "$apk_sha" != "$key_sha" ]; then
                    echo "::error::The APK is not signed with the release key (APK: $apk_sha, release key: $key_sha)"
                    exit 1
                  fi
                  echo "APK signed with the release key ($key_sha)"

            - name: Rename APK
              run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/lunavaritia-${{ github.ref_name }}.apk

            - name: Publish the release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: build/app/outputs/flutter-apk/lunavaritia-${{ github.ref_name }}.apk

            - name: Remove the keystore
              if: always()
              run: rm -f "$RUNNER_TEMP/release.jks"
