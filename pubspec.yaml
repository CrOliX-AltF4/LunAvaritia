name: lunavaritia
description: "Lun'Avaritia — mobile companion for the Lun ecosystem"
version: 1.3.1+7
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP
  http: ^1.2.2
  # State management
  provider: ^6.1.2
  # Local storage (server URL, cached identity — non-secret)
  shared_preferences: ^2.3.0
  # Secure storage for the server bearer token
  flutter_secure_storage: ^10.3.4
  # Firebase push notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2
  # Time formatting
  timeago: ^3.6.1
  # Cupertino icons
  cupertino_icons: ^1.0.8
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # The DA's typefaces (ADR-020 D5, DA2) — variable fonts, SIL Open Font License (licences beside them).
  assets:
    - assets/fonts/CormorantGaramond-OFL.txt
    - assets/fonts/Inter-OFL.txt
  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
